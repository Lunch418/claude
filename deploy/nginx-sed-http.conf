# ── Nginx: SED на :80 → PHP-FPM (доступ через SSH-туннель) ────────
# Модель: клиент открывает SED через SSH-туннель
#   ssh -L 0.0.0.0:8080:localhost:80 user@<vm>
# то есть попадает на localhost:80 этой ВМ. Транспорт уже шифруется SSH,
# поэтому TLS/443 здесь НЕ нужны, и порт 443 (проброс на другую ВМ) не трогаем.
#
# Установка:
#   sudo cp deploy/nginx-sed-http.conf /etc/nginx/sites-available/sed
#   sudo ln -sf /etc/nginx/sites-available/sed /etc/nginx/sites-enabled/sed
#   sudo nginx -t && sudo systemctl reload nginx
# Сокет php-fpm подставь свой (ls /run/php/): либо выделенный пул
# /run/php/php-fpm-sed.sock (deploy/php-fpm-sed.conf), либо дефолтный
# /run/php/phpX.Y-fpm.sock.

server {
    listen 80;
    server_name _;

    root  /var/www/sed;
    index db_viewer.html;

    client_max_body_size 3m;   # чуть больше лимита приложения (2 МБ)

    # ЗАЩИТА (V-02): .env, /storage, /tests, /private_js, исходники и т.п.
    include /var/www/sed/deploy/nginx-security.conf;

    # Статика (css/js/шрифты) — с кэшем
    location ~* \.(css|js|woff2?|svg|png|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "private, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm-sed.sock;   # ← свой сокет php-fpm
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Длинные запросы к БД (до ~10 мин)
        fastcgi_read_timeout 700s;
        fastcgi_send_timeout 700s;
        fastcgi_connect_timeout 15s;
        fastcgi_buffering off;
    }
}
