# ── Безопасность СЭД-вьювера (V-02) ────────────────────────────────
# Подключить внутри server { } основного конфига:  include .../nginx-security.conf;
# Под Nginx директивы .htaccess НЕ работают (а у вас Apache с AllowOverride None —
# .htaccess не читается и там). Эти правила location — и есть реальная защита.
#
# По HTTP наружу нужны только: /index.php, /db_viewer.html, /assets/*.
# Всё остальное закрываем. Особо важно закрыть: .env (секреты),
# /storage (выгруженные CSV), /tests (там мок server-router.php, который
# отдаёт модули без авторизации!), /.git (история/исходники).

# Точечные файлы: .env, .git, .htaccess и т.п. (кроме .well-known)
location ~ /\.(?!well-known) { deny all; }

# Секреты/исходники/служебное по расширению
location ~* \.(env|py|sh|sql|log|md|ini|dist|example|yml|yaml|toml|lock)$ { deny all; }

# Служебные каталоги — целиком закрыты от прямого доступа
location ^~ /scripts/    { deny all; }
location ^~ /storage/    { deny all; }
location ^~ /private_js/ { deny all; }   # модули отдаёт index.php (Asset), не напрямую
location ^~ /tests/      { deny all; }   # ВАЖНО: мок-роутер обходит авторизацию
location ^~ /deploy/     { deny all; }
location ^~ /Config/     { deny all; }
location ^~ /Core/       { deny all; }
location ^~ /Modules/    { deny all; }
location ^~ /.github/    { deny all; }

# Рекомендация: вынести DocumentRoot в отдельный public/, а .env, scripts,
# storage, tests и исходники держать ВЫШЕ корня — тогда они физически
# недостижимы по HTTP независимо от правил location.
