# ── Apache для СЭД-вьювера ────────────────────────────────────────
# РЕКОМЕНДАЦИЯ: mpm_event + PHP-FPM (см. php-fpm-sed.conf), НЕ mod_php.
# mod_php требует mpm_prefork (не потокобезопасен) — тяжёлый процесс на
# каждый одновременный запрос, что и упирается при нескольких пользователях.
#
#   a2dismod php8.x mpm_prefork
#   a2enmod  mpm_event proxy_fcgi setenvif
#   a2enconf php8.x-fpm

<VirtualHost 127.0.0.1:8080>
    ServerName sed.example.local
    DocumentRoot /var/www/sed

    Timeout 700
    ProxyTimeout 700

    <Directory /var/www/sed>
        Options -Indexes +FollowSymLinks
        AllowOverride All            # чтобы работали .htaccess (V-02)
        Require all granted
    </Directory>

    # PHP → FPM
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php-fpm-sed.sock|fcgi://localhost/"
    </FilesMatch>

    DirectoryIndex db_viewer.html index.php
    ErrorLog  ${APACHE_LOG_DIR}/sed-error.log
    CustomLog ${APACHE_LOG_DIR}/sed-access.log combined
</VirtualHost>

# ── mpm_event (в /etc/apache2/mods-available/mpm_event.conf) ──────
# <IfModule mpm_event_module>
#     StartServers             2
#     MinSpareThreads         25
#     MaxSpareThreads         75
#     ThreadsPerChild         25
#     MaxRequestWorkers      150   # верхний предел одновременных запросов
#     MaxConnectionsPerChild   0
# </IfModule>
#
# ── Если ВСЁ-ТАКИ остаётесь на mod_php + prefork ─────────────────
# Тогда параллелизм ограничен числом процессов; поднимите разумно под RAM
# (~40-60 МБ на процесс) и держите MaxRequestWorkers ≈ pm.max_children FPM:
# <IfModule mpm_prefork_module>
#     StartServers             4
#     MinSpareServers          4
#     MaxSpareServers         12
#     MaxRequestWorkers       40
#     MaxConnectionsPerChild 500
# </IfModule>
# Но помните: даже с большим числом воркеров узкое место — сериализация в
# демоне (одна SSH-сессия на профиль). См. SCALING.md, раздел «Демон».
