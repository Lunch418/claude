; ── PHP-FPM пул для СЭД-вьювера ──────────────────────────────────
; Путь: /etc/php/8.x/fpm/pool.d/sed.conf  (подгонять версию PHP)
; Даёт параллелизм на веб-слое: каждый одновременный запрос — отдельный
; воркер FPM (в отличие от Apache mod_php+prefork, где процесс тяжелее).

[sed]
user  = www-data
group = www-data
listen = /run/php/php-fpm-sed.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; dynamic: держим пул тёплым, растём под нагрузкой.
; max_children подбирать под RAM: ~50 МБ на воркер → 40 ≈ 2 ГБ.
pm = dynamic
pm.max_children      = 40
pm.start_servers     = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
; перезапуск воркера после N запросов — страховка от утечек
pm.max_requests      = 500

; Запросы-превью ждут ответа демона (SSH). Держим воркер достаточно долго,
; но чуть больше PHP-таймаута приложения (RemoteRunner phpTimeout=630с).
request_terminate_timeout = 700s

; Логи ошибок FPM
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php-fpm/sed-error.log
php_admin_flag[log_errors] = on

; Прод-значения PHP (дублируют ini на всякий случай)
php_admin_value[display_errors]     = Off
php_admin_value[max_execution_time] = 660
php_admin_value[memory_limit]       = 256M
php_admin_value[post_max_size]      = 3M
php_admin_value[upload_max_filesize]= 3M
; Сессии живут 8 ч (как cookie в index.php)
php_admin_value[session.gc_maxlifetime] = 28800
