# ── Apache vhost для СЭД (за Nginx) ───────────────────────────────
# Файл: /etc/apache2/sites-available/sed.conf → a2ensite sed
# Apache слушает ТОЛЬКО localhost:8080, наружу его не выставляем —
# TLS/443 терминирует Nginx и проксирует сюда.
#
# 1) В /etc/apache2/ports.conf добавьте:  Listen 127.0.0.1:8080
# 2) Убедитесь, что PHP исполняется Apache:
#      mod_php:  a2query -m php8*   (должен быть enabled; иначе a2enmod php8.x)
#      либо php-fpm: a2enmod proxy_fcgi setenvif && a2enconf php8.x-fpm
# 3) a2ensite sed && systemctl reload apache2

<VirtualHost 127.0.0.1:8080>
    ServerName sed.local
    DocumentRoot /var/www/sed
    DirectoryIndex db_viewer.html index.php

    Timeout 700               # запросы к БД могут идти до ~10 мин

    <Directory /var/www/sed>
        # Indexes ВЫКЛючен — чтобы нельзя было листать каталоги
        Options -Indexes +FollowSymLinks
        AllowOverride All      # включает .htaccess как второй рубеж (V-02)
        Require all granted
    </Directory>

    # Если PHP через php-fpm (а не mod_php) — раскомментируйте:
    # <FilesMatch \.php$>
    #     SetHandler "proxy:unix:/run/php/php8.x-fpm.sock|fcgi://localhost/"
    # </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/sed-error.log
    CustomLog ${APACHE_LOG_DIR}/sed-access.log combined
</VirtualHost>
