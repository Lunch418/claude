# ── Nginx: TLS/443 → Apache (mod_php) на 127.0.0.1:8080 ───────────
# Файл: /etc/nginx/sites-available/sed → ln -s в sites-enabled → nginx -t && reload
# Подходит под вашу схему (есть и nginx, и apache). Nginx терминирует HTTPS,
# ставит защиту (include nginx-security.conf) и проксирует всё в Apache.

# Редирект HTTP → HTTPS
server {
    listen 80;
    server_name _;            # ← замените на ваш домен/host, если есть
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;            # ← ваш домен/host

    ssl_certificate     /etc/ssl/sed/fullchain.pem;
    ssl_certificate_key /etc/ssl/sed/privkey.pem;
    # ssl_protocols заданы глобально в nginx.conf (TLS1.2/1.3) — ок.

    client_max_body_size 3m;  # чуть больше лимита приложения (2 МБ)

    # ЗАЩИТА (V-02): .env, /storage, /tests, /private_js, исходники и т.п.
    # ВАЖНО: подключить ДО общего location / — deny-правила должны иметь приоритет.
    include /var/www/sed/deploy/nginx-security.conf;

    # Всё остальное → Apache (он и статику, и PHP отдаёт)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # чтобы приложение включило HSTS/Secure-cookie
        # Длинные запросы к БД (до ~10 мин)
        proxy_connect_timeout 15s;
        proxy_read_timeout    700s;
        proxy_send_timeout    700s;
        proxy_buffering       off;
    }
}
