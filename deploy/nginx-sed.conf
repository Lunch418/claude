# ── Nginx для СЭД-вьювера (высокая одновременность) ───────────────
# Вариант, отдающий статику Nginx-ом и PHP — в PHP-FPM напрямую
# (рекомендуется). Если оставляете схему Nginx → Apache, см. блок внизу.
# Секьюрити-локейшны (V-02) — из deploy/nginx-security.conf.

# В http{} или /etc/nginx/nginx.conf:
#   worker_processes auto;              # по числу ядер
#   events { worker_connections 2048; } # потолок соединений на воркер

server {
    listen 443 ssl http2;
    server_name sed.example.local;      # ← ваш домен

    ssl_certificate     /etc/ssl/sed/fullchain.pem;
    ssl_certificate_key /etc/ssl/sed/privkey.pem;

    root /var/www/sed;                   # public-корень (см. SCALING.md)
    index db_viewer.html;

    client_max_body_size 3m;             # чуть больше лимита приложения (2 МБ)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /var/www/sed/deploy/nginx-security.conf;   # запрет .env/scripts/…

    # Статика (css/js/шрифты) — с кэшем
    location ~* \.(css|js|woff2?|svg|png|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "private, max-age=604800";
    }

    # PHP → FPM (сокет из php-fpm-sed.conf)
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm-sed.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # ── Таймауты: превью-запросы ждут демон/SSH (до ~10 мин) ──
        fastcgi_read_timeout 700s;
        fastcgi_send_timeout 700s;
        fastcgi_connect_timeout 15s;
        fastcgi_buffering off;           # длинные ответы не буферизуем в памяти
    }
}

# ────────────────────────────────────────────────────────────────
# АЛЬТЕРНАТИВА: сохраняете Nginx → Apache (mod_php)?
# Тогда вместо location ~ \.php$ проксируйте в Apache и поднимите таймауты:
#   location / {
#       proxy_pass http://127.0.0.1:8080;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_read_timeout 700s;
#       proxy_send_timeout 700s;
#       proxy_connect_timeout 15s;
#       proxy_buffering off;
#   }
# ВНИМАНИЕ: index.php читает X-Real-IP/X-Forwarded-For только с доверенного
# прокси (127.0.0.1/::1) — при Nginx на том же хосте это работает как надо.
