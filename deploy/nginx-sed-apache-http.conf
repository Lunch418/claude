# ── Nginx: :80 → Apache (mod_php) на 127.0.0.1:8080, без TLS ──────
# Модель: клиент открывает SED через SSH-туннель
#   ssh -L 0.0.0.0:8080:localhost:80 user@<vm>
# то есть попадает на localhost:80 этой ВМ. Транспорт уже шифрует SSH,
# поэтому TLS/443 здесь НЕ нужны, и порт 443 (проброс на другую ВМ) не трогаем.
# PHP на этой ВМ исполняет Apache (mod_php) на 127.0.0.1:8080 — не php-fpm.
#
# Установка:
#   sudo cp deploy/nginx-sed-apache-http.conf /etc/nginx/sites-available/sed
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    client_max_body_size 3m;   # чуть больше лимита приложения (2 МБ)

    # ЗАЩИТА (V-02): .env, /storage, /tests, /private_js, исходники и т.п.
    # ВАЖНО: подключено ДО location / — deny-правила должны иметь приоритет
    # над проксированием в Apache.
    include /var/www/sed/deploy/nginx-security.conf;

    # Всё остальное — статика и PHP — отдаёт Apache
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # HTTP, не HTTPS — приложение НЕ должно включать HSTS/Secure-cookie
        proxy_set_header X-Forwarded-Proto http;
        # Длинные запросы к БД (до ~10 мин)
        proxy_connect_timeout 15s;
        proxy_read_timeout    700s;
        proxy_send_timeout    700s;
        proxy_buffering       off;
    }
}
